name: Build windows installers

# Replaces the Jenkins dashboard-installer job (adjust SUFs → Setup Factory →
# publish). The Grafana binaries are downloaded from installer/grafana.url at
# build time; everything else the installers package is committed in release/,
# so no compile happens here — the workflow stamps the .suf projects, runs
# Setup Factory headlessly, signs the output and attaches it to the tag's
# GitHub release. The old installer/build-installers.bat orchestration is
# inlined as steps; only adjustSUFs.js and the .suf projects remain as files.
on:
  # Builds automatically on every push to develop, so an installer is always
  # available for the current integration branch. Tags still build for releases.
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_signing:
        description: "Skip code signing (dry runs without the eToken)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # upload installers to an existing GitHub release

concurrency:
  # One eToken on one physical box. GitHub concurrency groups are repo-scoped
  # so this can't serialise against open-msupply's builds — the single runner
  # slot on the box does that; this just stops our own runs stacking up.
  group: windows-build-server

env:
  # Machine tool locations — centralised here instead of hardcoded in the
  # steps, so a version bump is a one-line change.
  JSIGN_JAR: c:\mSupply_installer_codesigning\jsign-6.0.jar
  SETUP_FACTORY_EXE: C:\Program Files (x86)\Setup Factory 10\SUFDesign.exe
  TSA_URL: http://timestamp.sectigo.com
  # Setup Factory crashes when source file paths are too long (the grafana
  # public/ tree is deep), so release/ is mirrored to a short path first —
  # same reason Jenkins built from c:\temp\release.
  RELEASE_FOLDER: C:\temp\dashboard-release

jobs:
  build:
    name: Build, sign and package
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      # fetch-depth: 0 because the version comes from `git describe --tags`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # versionTag (e.g. v8.6.0) names the installer exes and is stamped into
      # the .suf ProductVer by adjustSUFs.js — replaces the version.txt the
      # Jenkins job used to write.
      # On a tag push the tag itself is the version. On a develop build there is
      # no tag at HEAD, so `git describe` returns <last-tag>-<n>-g<sha>; keep
      # that (it is unique and traceable) but prefix it so a dev installer is
      # never mistaken for a release build.
      - name: Record version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $versionTag = $env:GITHUB_REF_NAME
          } else {
            $describe = (git describe --tags --always).Trim()
            $versionTag = "dev-$env:GITHUB_REF_NAME-$describe"
          }
          Write-Host "versionTag=$versionTag"
          "versionTag=$versionTag" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # The .suf projects reference the "mSupply" installer theme, which Setup
      # Factory resolves from its machine-wide theme directory — install the
      # committed copy so the runner needs no manual theme setup (a missing
      # theme pops a modal dialog, which would hang a headless build).
      - name: Install Setup Factory theme
        shell: cmd
        run: |
          if not exist "installer\theme\mSupply" (
            echo installer\theme\mSupply is missing - commit the mSupply theme from the Setup Factory Themes directory on the old Jenkins box
            exit /b 1
          )
          xcopy "installer\theme\mSupply" "C:\ProgramData\IndigoRose\Setup Factory\10.0\Themes\mSupply" /e /c /i /y || exit /b 1

      # installer/grafana.url is the single source of truth for which Grafana
      # the installer ships, mirroring what build-installers.bat does locally.
      # Without this the build would package whatever binaries happen to be
      # committed under release/bin, which is how an old Grafana ended up in
      # shipped installers. Modern Grafana archives contain only bin\grafana.exe
      # (`server` and `cli` are subcommands), so stale grafana-server.exe /
      # grafana-cli.exe wrappers are removed to match the downloaded version.
      # Replace every Grafana-owned part of release/ from the archive named in
      # installer/grafana.url. Only refreshing bin/ would ship a new backend
      # behind the committed (older) frontend in public/, which is how the
      # installer ended up serving a 12.3.1 UI on a 13.2.2 server.
      #
      # Kept from the repo, because they are ours and not Grafana's:
      #   conf/custom.ini, conf/provisioning/  (site configuration)
      #   data/                                (grafana.db, msupply.db, panels)
      #   scripts/, bin/nssm.exe               (service tooling)
      - name: Install Grafana into release/
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = (Get-Content installer/grafana.url -Raw).Trim()
          if (-not $url) { throw "installer/grafana.url is empty" }
          Write-Host "Grafana URL: $url"

          $tmp = Join-Path $env:RUNNER_TEMP 'grafana'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Path $tmp | Out-Null

          $archive = Join-Path $tmp 'grafana.tar.gz'
          curl.exe -fL --retry 3 $url -o $archive
          if ($LASTEXITCODE -ne 0) { throw "download failed with exit code $LASTEXITCODE" }

          tar -xzf $archive -C $tmp
          if ($LASTEXITCODE -ne 0) { throw "extract failed with exit code $LASTEXITCODE" }

          $root = Get-ChildItem -Path $tmp -Directory -Filter 'grafana-*' |
            Where-Object { Test-Path (Join-Path $_.FullName 'bin/grafana.exe') } |
            Select-Object -First 1
          if (-not $root) { throw "grafana.exe not found in the downloaded archive" }
          Write-Host "Grafana archive root: $($root.Name)"

          # public/ and tools/ are wholly Grafana's: replace them outright so
          # files removed upstream do not linger from the previous version.
          foreach ($dir in 'public', 'tools') {
            $src = Join-Path $root.FullName $dir
            if (-not (Test-Path $src)) { throw "$dir missing from the archive" }
            if (Test-Path "release/$dir") { Remove-Item -Recurse -Force "release/$dir" }
            Copy-Item $src "release/$dir" -Recurse
            Write-Host "replaced release/$dir"
          }

          # bin/: take Grafana's executables but keep nssm.exe, which is ours.
          New-Item -ItemType Directory -Force -Path release/bin | Out-Null
          Get-ChildItem release/bin -File |
            Where-Object { $_.Name -ne 'nssm.exe' } |
            Remove-Item -Force
          Copy-Item (Join-Path $root.FullName 'bin/*') release/bin/ -Recurse -Force

          # conf/: Grafana's reference files only. custom.ini and provisioning/
          # are site configuration and must survive.
          foreach ($name in 'defaults.ini', 'sample.ini', 'ldap.toml', 'ldap_multiple.toml') {
            $src = Join-Path $root.FullName "conf/$name"
            if (Test-Path $src) { Copy-Item $src "release/conf/$name" -Force }
          }

          foreach ($name in 'LICENSE', 'NOTICE.md', 'README.md') {
            $src = Join-Path $root.FullName $name
            if (Test-Path $src) { Copy-Item $src "release/$name" -Force }
          }

          Write-Host "--- release/bin ---"
          Get-ChildItem release/bin | Select-Object Name, Length | Format-Table

      # dashboard-upgrade.suf packages release\data\plugins, so that folder has
      # to exist or Setup Factory aborts (exit code 2051). Build the custom
      # panels here rather than committing their dist output: the installer then
      # always ships plugins built against the Grafana in installer/grafana.url,
      # and ~117MB of build artefacts stays out of git. Each plugin is copied to
      # a folder named after its plugin.json id, which is what Grafana expects.
      - name: Build custom plugins into release/data/plugins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plugins = 'msupplyfoundation-table', 'msupplyfoundation-msupply-regionmap'

          $target = 'release/data/plugins'
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          foreach ($plugin in $plugins) {
            $dir = "custom-plugins/$plugin"
            Write-Host "::group::building $plugin"
            Push-Location $dir
            try {
              npm ci
              if ($LASTEXITCODE -ne 0) { throw "npm ci failed for $plugin" }
              npm run build
              if ($LASTEXITCODE -ne 0) { throw "npm run build failed for $plugin" }
            } finally {
              Pop-Location
            }
            Write-Host "::endgroup::"

            $manifest = Get-Content "$dir/dist/plugin.json" -Raw | ConvertFrom-Json
            $id = $manifest.id
            if (-not $id) { throw "$plugin has no id in dist/plugin.json" }

            $dest = Join-Path $target $id
            if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
            Copy-Item "$dir/dist" $dest -Recurse
            Write-Host "installed $plugin as $id"
          }

          Get-ChildItem $target | Select-Object Name | Format-Table

      - name: Mirror release to short path
        shell: pwsh
        run: |
          robocopy release $env:RELEASE_FOLDER /MIR /NFL /NDL /NJH /NP
          # robocopy exit codes 0-7 are success
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          exit 0

      # adjustSUFs.js stamps versionTag, the release source folder and the
      # output folder into the .suf projects in place (checkout resets them
      # each run). Jenkins never checked SUFDesign's exit code; here a failed
      # suf build fails the step — `|| exit /b` doesn't fire after
      # `start /wait` (start itself succeeds), so errorlevel is checked
      # explicitly.
      - name: Build installers (Setup Factory)
        shell: cmd
        run: |
          node "installer\adjustSUFs.js" || exit /b 1
          echo ##### building dashboard.suf
          start "" /wait "%SETUP_FACTORY_EXE%" /BUILD /LOG:installer\setup-factory.log "%GITHUB_WORKSPACE%\installer\dashboard.suf"
          @if %errorlevel% neq 0 exit /b %errorlevel%
          echo ##### building dashboard-upgrade.suf
          start "" /wait "%SETUP_FACTORY_EXE%" /BUILD /LOG:installer\setup-factory.log "%GITHUB_WORKSPACE%\installer\dashboard-upgrade.suf"
          @if %errorlevel% neq 0 exit /b %errorlevel%

      # The Setup Factory log is the only diagnostic SUFDesign produces —
      # surface it when the build fails.
      - name: Upload Setup Factory log (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: setup-factory-log
          path: installer/setup-factory.log
          if-no-files-found: ignore

      # ETOKEN storetype = SafeNet USB hardware token plugged into the build
      # box; --storepass avoids the interactive PIN dialog. Requires Java and
      # the SafeNet Authentication Client drivers on the runner.
      - name: Sign installers
        # Tag builds (releases) always sign. Manual runs sign unless
        # skip_signing is set. Automatic develop builds do not sign: signing
        # needs the physical eToken and a dev installer does not warrant
        # burning token operations on every push.
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && !inputs.skip_signing) }}
        shell: cmd
        run: |
          for %%e in ("%GITHUB_WORKSPACE%\installer\dashboard-*.exe") do java -jar "%JSIGN_JAR%" --storetype ETOKEN --storepass %ETOKEN_PASS% --tsaurl %TSA_URL% "%%e" || exit /b 1
        env:
          ETOKEN_PASS: ${{ secrets.ETOKEN_PASS }}

      - uses: actions/upload-artifact@v6
        with:
          name: msupply-dashboard-installers-${{ env.versionTag }}
          path: installer/dashboard-*.exe

      # Attach installers to the GitHub release for this tag — but only if a
      # release already exists (draft or published); the release list is
      # matched by tag_name (not get-by-tag) so draft releases count too.
      - name: Upload to GitHub release (if one exists)
        if: github.ref_type == 'tag'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) {
              core.info(`No release for ${tag} - skipping upload`);
              return;
            }
            const dir = path.join(process.env.GITHUB_WORKSPACE, 'installer');
            const installers = fs.readdirSync(dir).filter(f => f.startsWith('dashboard-') && f.endsWith('.exe'));
            for (const name of installers) {
              const existing = release.assets.find(a => a.name === name);
              if (existing) {
                core.info(`Replacing existing asset ${name}`);
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: existing.id });
              }
              core.info(`Uploading ${name}`);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(path.join(dir, name)),
                headers: { 'content-type': 'application/octet-stream' },
              });
            }
