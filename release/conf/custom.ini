
#################################### Paths ####################################
[paths]
# Path to where grafana can store temp files, sessions, and the sqlite3 db (if that is used)
;data = /var/lib/grafana

# Temporary files in `data` directory older than given duration will be removed
;temp_data_lifetime = 24h

# Directory where grafana can store logs
;logs = /var/log/grafana

# Directory where grafana will automatically scan and look for plugins
;plugins = /var/lib/grafana/plugins

# folder that contains provisioning config files that grafana will apply on startup and while running.
;provisioning = conf/provisioning

#################################### Server ####################################
[server]
# Protocol (http, https, socket)
protocol = https

# The ip address to bind to, empty will bind to all interfaces
;http_addr =

# The http port  to use
http_port = 3000

# The public facing domain name used to access grafana from a browser
domain = demo-board.msupply.org

# Redirect to correct domain if host header does not match domain
# Prevents DNS rebinding attacks
;enforce_domain = false

# The full public facing url you use in browser, used for redirects and emails
# If you use reverse proxy and sub path specify full url (with sub path)
root_url = https://demo-board.msupply.org:3000

# Log web requests
;router_logging = false

# enable gzip
enable_gzip = true

# https certs & key file
#cert_file = C:\Program Files\mSupply\mSupply Server\Server Database\cert.pem
#cert_key = C:\Program Files\mSupply\mSupply Server\Server Database\key.pem

[auth]
# `oauth_auto_login` was deprecated in Grafana 9 and is superseded by the
# per-provider `auto_login` under [auth.generic_oauth] below. Set that to
# true to allow only OAuth (i.e. mSupply) logins.

# Links pre-Grafana-10 accounts to their OAuth identity on first login.
#
# Grafana 10 changed OAuth user lookup from email to the IdP's unique ID, so
# accounts created by an older mSupply Dashboard have no user_auth.auth_id and
# fail to log in. With this on, Grafana falls back to matching on email, links
# the account and writes the auth_id itself - which is what
# conf/provisioning/grafanadb-update.bat does, but per user, on demand.
#
# Uncomment for the first upgrade of a client that has OAuth users from an
# older version. It can be turned off again once everyone has logged in once.
#
# "insecure" means: anyone who can set an address at the IdP could claim a
# Grafana account with that address. Here the IdP is mSupply itself, which is
# already the source of truth for these users, so that is not a new trust.
#
# It matches on email only. Users with no email address in Grafana or mSupply
# will not be linked this way - those need grafanadb-update.bat, which falls
# back to matching on name.
;oauth_allow_insecure_email_lookup = true
signout_redirect_url = """https://demo-board.msupply.org:2048/dashboard-oauth#/logout"""

#################################### Generic OAuth ##########################
[auth.generic_oauth]
name = OAuth
icon = signin
enabled = true
allow_sign_up = true
auto_login = false
client_id = 87e76bec
client_secret = some_secret
#scopes = user:email
scopes = openid email profile
empty_scopes = false
#email_attribute_name = email:primary
email_attribute_name = email
email_attribute_path =
login_attribute_path = preferred_username
#login_attribute_path =
name_attribute_path = name
role_attribute_path =
role_attribute_strict = false
org_attribute_path =
org_mapping =
groups_attribute_path =
id_token_attribute_name =
team_ids_attribute_path =
auth_url = http://localhost:2048/api/v4/oauth/
token_url = http://localhost:2048/api/v4/oauth_access_token/
api_url = http://localhost:2048/api/v4/oauth_userinfo/
signout_redirect_url =
teams_url =
allowed_domains =
allowed_groups =
team_ids =
allowed_organizations =
tls_skip_verify_insecure = false
tls_client_cert =
tls_client_key =
tls_client_ca =
use_pkce = false
auth_style =
allow_assign_grafana_admin = false
skip_org_role_sync = false
use_refresh_token = true
